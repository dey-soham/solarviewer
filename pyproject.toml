[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "solarviewer"
dynamic = ["version"]
description = "SolarViewer - A comprehensive tool for visualizing and analyzing solar radio images"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Soham Dey", email = "sohamd943@gmail.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "PyQt5>=5.15.0",
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
    "astropy>=5.0.0",
    "scipy>=1.7.0",
    "drms",
    "casatools>=6.4.0",
    "casatasks>=6.4.0",
    "sunpy[image,map,net,timeseries,visualization]>=5.0.0",
    "pillow",
    "python-casacore",
    "seaborn",
    "imageio>=2.16.0",
    "aiapy>=0.1.0",
    "imageio[ffmpeg]",
    "paramiko>=3.0.0",
    "pyqtgraph",
    "requests",
    "packaging",
    "pandas",
    "parfive",
    "aiohttp",
    "psutil",
]

[project.optional-dependencies]
dev = ["pytest", "black", "isort", "ruff"]

[project.scripts]
solarviewer = "solar_radio_image_viewer.main:main"
sv = "solar_radio_image_viewer.main:main"
viewcaltable = "solar_radio_image_viewer.pipeline.caltable_visualizer:main"
viewds = "solar_radio_image_viewer.pipeline.view_dynamic_spectra_GUI:main"
viewlogs = "solar_radio_image_viewer.pipeline.pipeline_logger_gui:main"
viewsolaractivity = "solar_radio_image_viewer.noaa_events.noaa_events_gui:main"
heliobrowser = "solar_radio_image_viewer.helioviewer_browser:main"

[project.urls]
Homepage = "https://github.com/dey-soham/solarviewer/"
Documentation = "https://github.com/dey-soham/solarviewer/wiki"
Source = "https://github.com/dey-soham/solarviewer/"
Tracker = "https://github.com/dey-soham/solarviewer/issues"

[tool.setuptools.dynamic]
version = { attr = "solar_radio_image_viewer.version.__version__" }

[tool.setuptools.packages.find]
include = ["solar_radio_image_viewer*"]

[tool.setuptools.package-data]
"solar_radio_image_viewer.assets" = ["*.png", "*.svg", "*.fits", "*.ttf"]

# ---------------------------------------------------------------- dev tools

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# Pyflakes (undefined names, unused imports, ...) plus a few error checks:
# bare except clauses (they also swallow Ctrl+C) and mutable or computed
# argument defaults (shared between calls).
select = ["F", "E9", "E722", "B006", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
